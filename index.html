<style>
:root{
  --bg:#ffffff; --card:#ffffff; --line:#ececec;
  --brand:#e06231; --deep:#e06231; --ink:#2b1a14; --muted:#7d665b;
  --dark:#1c1210;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:#fefdfa url(img/floral.jpg?v=3) center top/430px auto repeat;color:var(--ink);font:15px/1.45 Onest,system-ui,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.name,.chip,.price,.lang button{font-family:Onest,system-ui,sans-serif}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* hero */
@media(min-width:760px){.hero{max-width:760px;margin:0 auto}}
.hero{position:relative;overflow:hidden;padding:calc(14px + env(safe-area-inset-top)) 20px 22px;background:#2a1a12;color:#fff;min-height:435px;display:flex;flex-direction:column;justify-content:space-between}
.cuis{list-style:none;position:absolute!important;left:12px;bottom:10px;margin:0}
.cuis li{display:flex;align-items:center;gap:6px;font:600 12px Onest,system-ui,sans-serif;letter-spacing:.02em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.75)}
.cuis li+li{margin-top:4px}
.hero>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;opacity:0;transition:opacity .9s ease;pointer-events:none}
.hero>img.bg.on{opacity:1}
.hero>*:not(.bg){position:relative;z-index:1}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;margin-top:4px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7)) drop-shadow(0 0 10px rgba(0,0,0,.45))}
.brand .emb{width:46px;height:46px}
.brand .wm{font:600 17px Onest,system-ui,sans-serif;letter-spacing:.32em;text-transform:uppercase;padding-left:.32em}
.lang{position:absolute!important;right:12px;bottom:10px;display:flex;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:3px}
.lang button{padding:6px 9px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.01em;color:#f2e6dd}
.lang button.on{background:var(--brand);color:#fff}
.eyebrow{display:flex;align-items:center;gap:10px;margin-top:34px;font:700 11.5px Onest,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.eyebrow i{width:26px;height:1.5px;background:var(--brand);flex:none}
h1{font-size:36px;line-height:1.12;font-weight:700;margin-top:12px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--brand)}
.hero h1,.hero .eyebrow,.hero .lead,.hero .feats{text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 14px rgba(0,0,0,.7)}
.rule{display:flex;align-items:center;gap:10px;margin:18px 0 14px}
.rule i{flex:1;height:1.5px;background:linear-gradient(90deg,var(--brand),rgba(224,98,49,.15))}
.rule img{width:22px;opacity:.85}
.lead{font-size:15px;color:#f1e3d9;max-width:34ch}
.feats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-top:1px solid rgba(255,255,255,.22);padding-top:16px}
.feats div{padding:0 10px;border-left:1.5px solid var(--brand)}
.feats div:first-child{padding-left:0;border-left:0}
.feats b{display:block;font:700 12px Onest,system-ui,sans-serif;color:var(--brand);text-transform:uppercase;letter-spacing:.03em}
.feats span{display:block;font-size:12px;color:#ead8cc;margin-top:4px;line-height:1.35}

/* sticky nav */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.row{display:flex;align-items:center;gap:8px;padding:10px 0 11px 14px}
.sbtn{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#fff;border:1px solid var(--line);color:var(--ink)}
.bar.open .sbtn{background:var(--brand);border-color:var(--brand);color:#fff}
.search{display:none;flex:1;align-items:center;gap:8px;margin-right:14px;background:#f6f6f6;border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;height:38px}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none;min-width:0}
.search .x{width:28px;height:28px;border-radius:50%;background:#e4e4e4;font-size:17px;line-height:28px;text-align:center;flex:none}
.bar.open .search{display:flex}
.bar.open .chips{display:none}
.chips{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:0 14px 0 0;scrollbar-width:none;scroll-behavior:smooth}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;background:var(--card);
  border:1px solid var(--line);color:var(--ink);white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.chip.on{background:var(--deep);border-color:var(--deep);color:#fff}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}

/* content */
main{padding:4px 14px 30px;max-width:760px;margin:0 auto}
section.cat{padding-top:30px;scroll-margin-top:118px}
.cat>h2{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;font-size:24px;font-weight:700;line-height:1.2}
.cat>h2:before,.cat>h2:after{content:"";flex:0 0 46px;height:18px;background:var(--brand);-webkit-mask:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 52 20%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.8%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M50 10H22%22/%3E%3Cpath d=%22M22 10C15 10 12 4.5 15.5 2.6C18.4 1 20.6 4.6 18 6%22/%3E%3Cpath d=%22M22 10C15 10 12 15.5 15.5 17.4C18.4 19 20.6 15.4 18 14%22/%3E%3Cpath d=%22M8 10l3-3 3 3-3 3z%22 fill=%22%23000%22 stroke=%22none%22/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 52 20%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.8%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M50 10H22%22/%3E%3Cpath d=%22M22 10C15 10 12 4.5 15.5 2.6C18.4 1 20.6 4.6 18 6%22/%3E%3Cpath d=%22M22 10C15 10 12 15.5 15.5 17.4C18.4 19 20.6 15.4 18 14%22/%3E%3Cpath d=%22M8 10l3-3 3 3-3 3z%22 fill=%22%23000%22 stroke=%22none%22/%3E%3C/svg%3E") center/contain no-repeat}
.cat>h2:after{transform:scaleX(-1)}
.cat>.sub{text-align:center;font:700 11px Onest,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
.gh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0 10px}
.gh h3{font-size:15px;color:var(--brand);font-weight:700}
.badge{font:700 11px Onest,system-ui,sans-serif;padding:3px 8px;border-radius:999px;background:var(--brand);color:#fff}
.badge.soft{background:#f8ebe4;color:var(--deep)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.gh+.grid{margin-top:0}
.card{display:flex;flex-direction:column;border:1px solid #efd9cc;border-radius:18px;padding:7px;background:#fff;
  box-shadow:0 1px 0 rgba(163,51,34,.03),0 8px 22px -14px rgba(120,50,20,.18)}
.pic{position:relative;aspect-ratio:1/1;border-radius:13px;overflow:hidden;background:linear-gradient(150deg,#fbf4ef,#f3e3d8);display:flex;align-items:center;justify-content:center}
.pic img.ph{width:34%;opacity:.16;filter:grayscale(.2)}
.pic img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.info{position:absolute;inset:0;padding:11px 11px;background:rgba(255,255,255,.86);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  opacity:0;transition:opacity .22s;overflow-y:auto;text-align:left;pointer-events:none}
.card.open .info{opacity:1;pointer-events:auto}
.info .alt{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3}
.info .desc{font-size:12.5px;color:#3d2c24;margin-top:0;line-height:1.38}
.info .desc+.note{margin-top:6px}
.info .note{font-size:12px;color:var(--muted)}
.card.open .card.tap{cursor:pointer}
.cb{display:flex;flex-direction:column;flex:1;padding:9px 5px 3px}
.name{font-size:15.5px;font-weight:500;line-height:1.1;letter-spacing:-.005em;color:var(--brand);word-break:break-word}
.name .hot{white-space:nowrap;margin-left:3px;font-size:11px;letter-spacing:-2px}
.price{margin-top:auto;padding-top:3px;font-family:Onest,system-ui,sans-serif;font-weight:500;font-size:14px;letter-spacing:-.01em;line-height:1.2;color:var(--ink);white-space:nowrap}
.price.multi{font-size:13px}
.price div+div{margin-top:1px}
.price .v{font:600 11.5px Onest,system-ui,sans-serif;color:var(--muted);margin-right:5px}
.empty{display:none;text-align:center;color:var(--muted);padding:50px 20px}
.legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:26px 0 6px}
footer{text-align:center;padding:24px 20px calc(30px + env(safe-area-inset-bottom));color:var(--muted);font-size:12.5px}
footer img{width:46px;margin:0 auto 10px;opacity:.9}
.top{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--deep);color:#fff;box-shadow:0 6px 18px rgba(80,30,10,.3);font-size:20px;opacity:0;pointer-events:none;
  transform:translateY(8px);transition:opacity .2s,transform .2s;z-index:30}
.top.show{opacity:1;pointer-events:auto;transform:none}
mark{background:#fbd9c4;color:inherit;border-radius:3px}
</style>
</head>
